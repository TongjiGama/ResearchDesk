<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self'; frame-src 'self' file: http: https:; object-src 'none'; base-uri 'self' file:; form-action 'self';">
  <title>科研台</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/lineage.css">
  <link rel="stylesheet" href="css/idea.css">
  <link rel="stylesheet" href="css/experiment.css">
</head>
<body>
  <div id="app" class="app">
    <!-- 左侧工作区栏 -->
    <aside id="workspaceBar" class="workspace-bar">
      <div class="ws-upper drag-region">
        <div class="ws-brand no-drag" title="科研台">
          <span class="brand-mark"><span data-ico="layers" data-ico-size="18"></span></span>
          <span class="brand-name">科研台</span>
          <button class="icon-btn panel-toggle" id="wsToggleBtn" title="工作区栏 · 开/关" aria-label="工作区栏 · 开/关" aria-pressed="true"><span data-ico="menu"></span></button>
        </div>
        <button class="ws-switch no-drag" id="wsSwitchBtn" title="切换工作区" aria-label="切换工作区" aria-haspopup="menu" aria-expanded="false">
          <span class="ws-switch-name" id="wsBreadcrumb">工作区</span>
          <span class="ws-switch-ico"><span data-ico="chevronDown" data-ico-size="12"></span></span>
        </button>
        <div class="ws-utility no-drag">
          <button class="icon-btn" id="statsBtn" title="工作区统计" aria-label="工作区统计" data-tooltip="统计"><span data-ico="stats"></span></button>
          <button class="icon-btn" id="cmdBtn" title="命令面板 · Ctrl+K" aria-label="命令面板 · Ctrl+K" data-tooltip="命令"><span data-ico="command"></span></button>
          <button class="icon-btn" id="helpBtn" title="快捷键帮助 · Ctrl+/" aria-label="快捷键帮助 · Ctrl+/" data-tooltip="快捷键"><span data-ico="keyboard"></span></button>
          <button class="icon-btn panel-toggle" id="listToggleBtn" title="列表栏 · 开/关" aria-label="列表栏 · 开/关" aria-pressed="true" data-tooltip="列表"><span data-ico="panelLeft"></span></button>
          <button class="theme-toggle" id="themeToggleBtn" title="切换主题" aria-label="切换主题" data-tooltip="主题"><span data-ico="moon"></span></button>
          <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置" data-tooltip="设置"><span data-ico="settings"></span></button>
        </div>
      </div>
      <div class="ws-section-head"><span>工作区</span><span class="ws-count" id="wsCount"></span></div>
      <div class="ws-list" id="workspaceList"></div>
      <div class="ws-footer">
        <button class="ws-add" id="wsAddBtn"><span data-ico="plus" data-ico-size="14"></span>新建工作区</button>
      </div>
    </aside>
    <div class="ws-rail" id="wsRail" title="展开工作区栏"><span>工作区</span></div>
    <div class="ws-width-handle" id="wsWidthHandle" title="拖动调整工作区栏宽度"></div>

    <!-- 主区域 -->
    <main class="main">
      <!-- 顶部栏（自绘，可拖拽窗口） -->
      <header class="topbar drag-region">
        <div class="topbar-left">
          <div class="board-tabs no-drag" id="boardTabs" role="tablist" aria-label="内容板块">
            <button class="board-tab" data-board="discovery" role="tab" aria-selected="false" tabindex="-1"><span data-ico="search" data-ico-size="14"></span>检索</button>
            <button class="board-tab active" data-board="papers" role="tab" aria-selected="true" tabindex="0"><span data-ico="fileText" data-ico-size="14"></span>论文</button>
            <button class="board-tab" data-board="timeline" role="tab" aria-selected="false" tabindex="-1"><span data-ico="timeline" data-ico-size="14"></span>论文脉络</button>
            <button class="board-tab" data-board="ideas" role="tab" aria-selected="false" tabindex="-1"><span data-ico="lightbulb" data-ico-size="14"></span>Idea</button>
            <button class="board-tab" data-board="experiments" role="tab" aria-selected="false" tabindex="-1"><span data-ico="flask" data-ico-size="14"></span>实验</button>
          </div>
        </div>
        <div class="topbar-right no-drag">
          <button class="icon-btn win-btn" id="winMinBtn" title="最小化" aria-label="最小化窗口"><span data-ico="minimize"></span></button>
          <button class="icon-btn win-btn" id="winMaxBtn" title="最大化 / 还原" aria-label="最大化或还原窗口"><span data-ico="maximize"></span></button>
          <button class="icon-btn win-btn close" id="winCloseBtn" title="关闭" aria-label="关闭窗口"><span data-ico="close"></span></button>
        </div>
      </header>
      <!-- 内容区 -->
      <section class="content" id="content">
        <div class="discovery-page" id="discoveryPage"></div>
        <div class="timeline-page" id="timelinePage"></div>
        <div class="pane-list" id="paneList">
          <div class="list-toolbar" id="listToolbar"></div>
          <div class="list-scroll" id="listScroll"></div>
          <div class="list-foot" id="listFoot"></div>
        </div>
        <div class="list-rail" id="listRail" title="展开列表栏"><span>列表</span></div>
        <div class="pane-resizer" id="paneResizer" title="拖动调整列表宽度"></div>
        <div class="pane-detail" id="paneDetail">
          <div class="detail-toolbar" id="detailToolbar">
            <button class="icon-btn" id="focusToggleBtn" title="专注模式 · Esc 退出"><span data-ico="focus"></span></button>
          </div>
          <div class="detail-empty" id="detailEmpty">
            <div class="empty-illustration">
              <span class="empty-glow"></span>
              <span class="empty-main-ico" data-ico="layers" data-ico-size="46"></span>
              <span class="empty-spark"><span data-ico="sparkle" data-ico-size="16"></span></span>
            </div>
            <div class="empty-text">从左侧列表选择一项查看详情</div>
            <div class="empty-sub">或按 <kbd>Ctrl</kbd><kbd>K</kbd> 快速跳转</div>
          </div>
          <div id="detailRoot"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 悬浮摘要窗 -->
  <div class="hover-card" id="hoverCard"></div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  <!-- 模态框容器 -->
  <div class="modal-root" id="modalRoot"></div>
  <!-- 命令面板容器 -->
  <div class="cmdk-root" id="cmdkRoot"></div>

  <script src="marked.min.js"></script>
  <script src="icons.js"></script>
  <script src="chart.min.js"></script>
  <script src="csv.js"></script>
  <script src="charts.js"></script>
  <script src="timeline.js"></script>
  <script src="stats.js"></script>
  <script src="runtime.js"></script>
  <script src="controllers/workspace-controller.js"></script>
  <script src="controllers/paper-controller.js"></script>
  <script src="controllers/idea-controller.js"></script>
  <script src="controllers/experiment-controller.js"></script>
  <script src="controllers/reference-controller.js"></script>
  <script src="controllers/discovery-controller.js"></script>
  <script src="controllers/overlay-controller.js"></script>
  <script src="app.js"></script>
</body>
</html>
